name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      run_full_checks:
        description: 'Run full checks (format, analyze, tests, audits, db, smoke, web)'
        type: boolean
        required: false
        default: false
      run_smoke:
        description: 'Also run Supabase smoke test (needs SMOKE_* secrets)'
        type: boolean
        required: false
        default: false
      confirm_prod:
        description: 'Confirm running against a URL containing "prod"'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build release APK (lean)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Set up Android SDK (platform 34, build-tools 34.0.0)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
              "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Check Supabase secrets
        id: supabase_secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_URL/SUPABASE_ANON_KEY unavailable; building APK without dart-defines."
          fi

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ "${{ steps.supabase_secrets.outputs.available }}" = "true" ]; then
            flutter build apk --release \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: yusra-pharmacy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 30

  full_checks:
    name: Full checks (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: flutter pub get
      - name: Verify Dart formatting
        run: dart format --set-exit-if-changed .
      - name: Analyze Edge Functions (Deno)
        run: |
          deno check --no-config supabase/functions/admin-create-user/index.ts
          deno check --no-config supabase/functions/admin-reset-password/index.ts
      - name: Wiring and role-matrix audit checks
        run: |
          dart run tool/gen_role_matrix.dart --check
          dart run tool/wiring_audit.dart --check
      - name: Flutter analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --exclude-tags e2e-api
