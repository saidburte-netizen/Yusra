name: CI

# Every push and every pull request, on every branch.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  # Manual end-to-end checks against the real Supabase project.
  workflow_dispatch:
    inputs:
      run_smoke:
        description: 'Also run the Supabase smoke test (needs SMOKE_* secrets)'
        type: boolean
        required: false
        default: false
      confirm_prod:
        description: 'Confirm running against a URL containing "prod"'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # STEP 0 — this job is the gate for everything else. It installs and prints
  # every pinned version, including the Docker/PostgREST image used by e2e-api.
  toolchain:
    name: STEP 0 — install and print toolchain versions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      POSTGREST_IMAGE: postgrest/postgrest:v12.2.3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Set up Android SDK (platform 34, build-tools 34.0.0)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
              "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node and Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: STEP 0 — print every pinned version
        run: |
          set -euo pipefail
          chmod +x tool/ci_psql.sh
          npm install -g playwright@1.48.2
          npx playwright install --with-deps chromium
          echo "=== Flutter / Dart ==="
          flutter --version
          dart --version
          echo "=== Java ==="
          java -version
          echo "=== Gradle wrapper ==="
          bash ./android/gradlew --version | tee /tmp/gradle-version.txt
          echo "=== Android SDK ==="
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed | \
            grep -E 'platforms;android-34|build-tools;34.0.0|platform-tools'
          echo "=== Deno ==="
          deno --version
          echo "=== Node / Playwright ==="
          node --version
          npm --version
          npx playwright --version
          echo "=== Supabase CLI ==="
          supabase --version
          echo "=== PostgreSQL 16 ==="
          bash tool/ci_psql.sh --version
          bash tool/ci_psql.sh -d postgres -Atc 'select version();'
          echo "=== Docker ==="
          docker --version
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          echo "=== PostgREST image ==="
          docker pull "$POSTGREST_IMAGE"
          docker image inspect "$POSTGREST_IMAGE" \
            --format 'image={{index .RepoTags 0}} id={{.Id}}'

          flutter --version | head -1 | grep -q '3.24.5'
          dart --version 2>&1 | grep -q 'Dart SDK version: 3\.'
          java -version 2>&1 | head -1 | grep -q '"17\.'
          grep -q 'Gradle 8\.3' /tmp/gradle-version.txt
          deno --version | head -1 | grep -q '^deno '
          node --version | grep -q '^v20\.'
          npx playwright --version | grep -q 'Version '
          supabase --version | grep -q '.'
          bash tool/ci_psql.sh --version | grep -q ' 16\.'
          docker version --format '{{.Server.Version}}' | grep -q '.'
          echo "STEP 0 PASSED: Flutter 3.24.5, Dart 3, Java 17, Gradle 8.3, Android SDK 34/34.0.0, Deno, Node 20, Playwright, Supabase CLI, PostgreSQL 16, Docker, $POSTGREST_IMAGE."

  build:
    name: Analyze, test, build APK and web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: toolchain

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the stable release the whole team develops against, so
          # local analysis and the Actions run behave identically.
          flutter-version: '3.24.5'
          cache: true

      - name: Set up Android SDK (platform 34, build-tools 34.0.0)
        # GitHub-hosted runners already ship the SDK. Installing it through
        # setup-android downloads a fresh command-line tools bundle on every
        # run, which has recently failed while unpacking platform-tools.
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
              "platforms;android-34" "build-tools;34.0.0"
          fi
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed | \
            grep -E 'platforms;android-34|build-tools;34.0.0'

      - name: Verify pinned platform-tools
        # Use the runner image's pinned platform-tools rather than downloading
        # a second copy, which has previously unpacked corruptly in this repo.
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          PROPS="$SDK/platform-tools/source.properties"
          test -f "$PROPS"
          grep '^Pkg.Revision=' "$PROPS"
          "$SDK/platform-tools/adb" version | head -1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check PostgreSQL client
        # The runner's psql is only used for reporting here. The db-test job
        # runs every SQL file with the matching client inside postgres:16 via
        # tool/ci_psql.sh, so no apt install is needed (and the package is not
        # always available on the runner image).
        run: |
          psql --version || true

      # STEP 0 — every tool the build or db-test jobs rely on is installed and
      # printed here, before any dependency install, analysis, test or build.
      - name: STEP 0 — install and print toolchain versions
        run: |
          echo "=== Flutter / Dart ==="
          flutter --version
          dart --version
          echo "=== Java ==="
          java -version
          echo "=== Gradle wrapper ==="
          bash ./android/gradlew --version | tee /tmp/gradle-version.txt
          echo "=== Deno ==="
          deno --version
          echo "=== PostgreSQL ==="
          psql --version
          echo "=== Android SDK ==="
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed | \
            grep -E 'platforms;android-34|build-tools;34.0.0|platform-tools'
          echo "=== Flutter doctor ==="
          # Diagnostics only: hosted runners may report optional desktop
          # toolchain issues (GTK/Android licenses) that do not affect APK/web.
          flutter doctor -v || true

          flutter --version | head -1 | grep -q '3.24.5'
          dart --version 2>&1 | grep -q 'Dart SDK version: 3\.'
          java -version 2>&1 | head -1 | grep -q '"17\.'
          grep -q 'Gradle 8\.3' /tmp/gradle-version.txt
          deno --version | head -1 | grep -q '^deno '
          psql --version || true
          echo "Toolchain assertions passed (Flutter 3.24.5, Gradle 8.3, Deno). PostgreSQL 16 is asserted by the db-test job via tool/ci_psql.sh."

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze Edge Functions (Deno)
        run: |
          deno check --no-config supabase/functions/admin-create-user/index.ts
          deno check --no-config supabase/functions/admin-reset-password/index.ts

      - name: Analyze
        run: flutter analyze

      - name: Wiring and role-matrix audit checks
        run: |
          dart run tool/gen_role_matrix.dart --check
          dart run tool/wiring_audit.dart --check

      - name: Test
        # The PostgREST-backed suite lives in test_e2e and is tagged e2e-api.
        # It is exercised by its own job with real services; here it must not
        # run against the untagged unit-test environment.
        run: flutter test --exclude-tags e2e-api

      # Optional release signing. When the four secrets are absent the build
      # falls back to the debug key, so a fresh repository is green out of the box.
      - name: Prepare optional Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/yusra-release.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/yusra-release.jks
          EOF
            echo "Release keystore configured."
          else
            echo "No keystore secrets found; using the default debug signing."
          fi

      - name: Verify Supabase secrets
        id: supabase_secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_URL_LENGTH=${#SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY_LENGTH=${#SUPABASE_ANON_KEY}"
            exit 0
          fi
          if [ "$IS_FORK" = "true" ] || [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_URL/SUPABASE_ANON_KEY unavailable for fork/Dependabot PR; skipping APK/web build and upload."
            exit 0
          fi
          echo "::error::Repository secrets SUPABASE_URL and SUPABASE_ANON_KEY are required to build a usable APK/web bundle."
          exit 1

      - name: Build release APK
        if: steps.supabase_secrets.outputs.available == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify Supabase keys in APK
        if: steps.supabase_secrets.outputs.available == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          HOST="$(python3 -c "from urllib.parse import urlparse; import os; print(urlparse(os.environ['SUPABASE_URL']).hostname or '')")"
          if [ -z "$HOST" ]; then
            echo "MISSING"
            exit 1
          fi
          TMP="$(mktemp -d)"
          unzip -oq "$APK" -d "$TMP"
          if grep -aFlq "$HOST" "$TMP"/lib/*/libapp.so; then
            echo "OK"
          else
            echo "MISSING"
            exit 1
          fi

      - name: Build release web
        if: steps.supabase_secrets.outputs.available == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release \
            --pwa-strategy=none \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK artifact
        if: steps.supabase_secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: yusra-pharmacy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload web artifact
        if: steps.supabase_secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: yusra-pharmacy-web
          path: build/web/
          if-no-files-found: error
          retention-days: 30

  db-test:
    name: Postgres schema and migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: toolchain

    # REQUIRED job: no `if`, no `continue-on-error`. A red db-test blocks the
    # Edge Function deploy job below as well as the PR checks.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # STEP 0 for SQL: the postgres:16 service image provides both the server
      # and the matching client; print both before applying anything.
      - name: STEP 0 — print PostgreSQL 16 version
        # Use the client inside the postgres:16 service image. The runner's
        # preinstalled psql is not guaranteed to be major version 16 and the
        # matching apt package is not available on every image revision.
        run: |
          set -euo pipefail
          chmod +x tool/ci_psql.sh
          bash tool/ci_psql.sh --version | grep -q ' 16\.'
          bash tool/ci_psql.sh -d postgres -Atc 'select version();'
          bash tool/ci_psql.sh -d postgres -Atc 'select 1'

      - name: Create test databases
        run: |
          set -euo pipefail
          bash tool/ci_psql.sh -d postgres -v ON_ERROR_STOP=1 -q \
            -c 'create database yusra_owner' \
            -c 'create database yusra_migrations'

      - name: Install Supabase-compatible stubs
        run: |
          set -euo pipefail
          for db in yusra_owner yusra_migrations; do
            echo "=== bootstrapping Supabase stubs in $db ==="
            bash tool/ci_psql.sh -d "$db" -v ON_ERROR_STOP=1 -q -f tool/supabase_stubs.sql
          done

      - name: Apply all_owner_sql.sql twice (idempotency)
        run: |
          set -euo pipefail
          for pass in 1 2; do
            echo "=== all_owner_sql.sql pass $pass ==="
            if ! bash tool/ci_psql.sh -d yusra_owner -v ON_ERROR_STOP=1 -q \
                 -f supabase/all_owner_sql.sql > "/tmp/owner-pass-$pass.log" 2>&1; then
              cat "/tmp/owner-pass-$pass.log"
              echo "::error::all_owner_sql.sql failed on pass $pass"
              exit 1
            fi
            echo "all_owner_sql.sql pass $pass: OK"
          done

      - name: Apply numbered migrations in order
        run: |
          set -euo pipefail
          for file in supabase/migrations/*.sql; do
            echo "=== $file ==="
            bash tool/ci_psql.sh -d yusra_migrations -v ON_ERROR_STOP=1 -q -f "$file"
          done

      - name: schema_check.sql (fail on any non-PASS row)
        run: |
          set -euo pipefail
          echo "=== supabase/checks/schema_check.sql result table ==="
          bash tool/ci_psql.sh -d yusra_migrations -v ON_ERROR_STOP=1 -At -F '|' \
            -f supabase/checks/schema_check.sql | tee /tmp/schema-check.txt
          test -s /tmp/schema-check.txt
          awk -F '|' '
            NF >= 3 && $3 != "PASS" {
              print "::error::schema_check row is not PASS: " $0
              bad = 1
            }
            END { exit bad ? 1 : 0 }
          ' /tmp/schema-check.txt

      - name: Run tool/db_test.sql
        run: |
          set -euo pipefail
          echo "=== tool/db_test.sql result table ==="
          bash tool/ci_psql.sh -d yusra_migrations -v ON_ERROR_STOP=1 -f tool/db_test.sql | tee /tmp/db-test.txt
          test -s /tmp/db-test.txt
          # db_test.sql raises on failure, but explicitly inspect every row too
          # so a future change that stops raising cannot turn red into green.
          awk -F '|' '
            NF >= 3 && $3 ~ /FAIL/ {
              print "::error::db_test row failed: " $0
              bad = 1
            }
            END { exit bad ? 1 : 0 }
          ' /tmp/db-test.txt

  smoke-test:
    name: Manual Supabase smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: toolchain
    # Opt-in manual check only. It must never turn a successful APK build into
    # a failed workflow just because demo credentials are not configured.
    if: github.event_name == 'workflow_dispatch' && inputs.run_smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Dart
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Check smoke secrets
        id: smoke_guard
        env:
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_CASHIER_EMAIL: ${{ secrets.SMOKE_CASHIER_EMAIL }}
          SMOKE_CASHIER_PASSWORD: ${{ secrets.SMOKE_CASHIER_PASSWORD }}
          SMOKE_PHARMACIST_EMAIL: ${{ secrets.SMOKE_PHARMACIST_EMAIL }}
          SMOKE_PHARMACIST_PASSWORD: ${{ secrets.SMOKE_PHARMACIST_PASSWORD }}
        run: |
          if [ -z "$SMOKE_ADMIN_EMAIL" ] || [ -z "$SMOKE_ADMIN_PASSWORD" ] ||
             [ -z "$SMOKE_CASHIER_EMAIL" ] || [ -z "$SMOKE_CASHIER_PASSWORD" ] ||
             [ -z "$SMOKE_PHARMACIST_EMAIL" ] || [ -z "$SMOKE_PHARMACIST_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SMOKE_* secrets are not configured; skipping the optional smoke test."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run smoke test
        if: steps.smoke_guard.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_CASHIER_EMAIL: ${{ secrets.SMOKE_CASHIER_EMAIL }}
          SMOKE_CASHIER_PASSWORD: ${{ secrets.SMOKE_CASHIER_PASSWORD }}
          SMOKE_PHARMACIST_EMAIL: ${{ secrets.SMOKE_PHARMACIST_EMAIL }}
          SMOKE_PHARMACIST_PASSWORD: ${{ secrets.SMOKE_PHARMACIST_PASSWORD }}
          SMOKE_BRANCH_ID: ${{ secrets.SMOKE_BRANCH_ID }}
          SMOKE_EXPIRED_BATCH_ID: ${{ secrets.SMOKE_EXPIRED_BATCH_ID }}
          SMOKE_CONFIRM: ${{ inputs.confirm_prod && '1' || '0' }}
        run: dart run tool/smoke_test.dart

  e2e-api:
    name: End-to-end API tests (PostgreSQL 16 + PostgREST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [toolchain, db-test]

    # Real HTTP against real repositories. No app operation is replayed as
    # hand-written SQL: SQL is only used for CI stubs, the schema bundle and
    # creating an auth user (the admin-create-user Edge Function equivalent).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      E2E_POSTGREST_URL: http://127.0.0.1:3000
      POSTGREST_IMAGE: postgrest/postgrest:v12.2.3
      # Fixed test-only HS256 secret, shared with the Dart JWT signer.
      PGRST_JWT_SECRET: e2e-only-hs256-secret-at-least-32-chars-long

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Print toolchain versions
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          bash tool/ci_psql.sh --version | grep -q ' 16\.'
          docker --version
          docker pull "$POSTGREST_IMAGE"

      - name: Install Supabase stubs and full schema
        run: |
          set -euo pipefail
          chmod +x tool/ci_psql.sh tool/e2e_postgrest.sh
          bash tool/ci_psql.sh -d postgres -v ON_ERROR_STOP=1 -q -f tool/supabase_stubs.sql
          bash tool/ci_psql.sh -d postgres -v ON_ERROR_STOP=1 -q -f supabase/all_owner_sql.sql

      - name: Start PostgREST v12.2.3
        run: |
          set -euo pipefail
          docker run -d --name e2e-postgrest --network host \
            -e PGRST_DB_URI="postgres://e2e_authenticator:e2e_authenticator@127.0.0.1:5432/postgres" \
            -e PGRST_DB_SCHEMA=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$PGRST_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3000 \
            -e PGRST_DB_MAX_ROWS=1000 \
            "$POSTGREST_IMAGE"
          bash tool/e2e_postgrest.sh wait
          curl -fsS "$E2E_POSTGREST_URL/"

      - name: Install dependencies
        run: flutter pub get

      - name: Run e2e-api suite
        run: flutter test test_e2e/e2e_api_test.dart -r expanded

      - name: PostgREST logs (diagnostics)
        if: always()
        run: docker logs e2e-postgrest || true

  deploy-edge-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    needs: [toolchain, build, db-test, e2e-api]
    # Only from main, and only when both deploy secrets exist (missing secrets
    # make this job a no-op rather than a failure).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check deploy secrets
        id: deploy_secrets
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$REF" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Supabase CLI
        if: steps.deploy_secrets.outputs.available == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy admin-create-user
        if: steps.deploy_secrets.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy admin-create-user --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy admin-reset-password
        if: steps.deploy_secrets.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy admin-reset-password --project-ref "$SUPABASE_PROJECT_REF"
