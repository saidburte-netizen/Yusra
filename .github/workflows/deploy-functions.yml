name: Deploy functions

# Manual only. Deploys the two admin Edge Functions that the staff screens
# call. Migration validation and tests are deliberately not part of this job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy admin Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required secrets
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing. Add them in Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
          echo "Required Supabase secrets are present."

      - name: Set up Supabase CLI (pinned 3.3.0)
        uses: supabase/setup-cli@v1
        with:
          version: 3.3.0

      - name: Deploy admin-create-user
        run: supabase functions deploy admin-create-user --remote="$SUPABASE_PROJECT_REF" --yes

      - name: Deploy admin-reset-password
        run: supabase functions deploy admin-reset-password --remote="$SUPABASE_PROJECT_REF" --yes
