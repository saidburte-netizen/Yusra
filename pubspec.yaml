name: yusra_pharmacy
description: "Yusra Pharmacy - Care made easy. Pharmacy control system (stock, purchasing, POS, prescriptions, shifts, finance and staff)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.6.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  pdf: ^3.11.3
  printing: ^5.12.0
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  csv: ^6.0.0
  shared_preferences: ^2.5.6
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.3
  share_plus: ^10.0.2
  permission_handler: ^11.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Test-only: HS256 JWT signing for the PostgREST-backed e2e-api suite.
  crypto: ^3.0.3

# app_links 6.4.1 uses `flutter.compileSdkVersion` from a plugin buildscript and
# pulls AGP 8.6.1, which cannot be evaluated by the Gradle 8.3 toolchain that
# ships with the pinned Flutter 3.24.5 SDK. 6.2.0 satisfies supabase_flutter's
# `>=6.2.0 <8.0.0` constraint and builds with the app's AGP 8.1.0.
dependency_overrides:
  app_links: 6.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
