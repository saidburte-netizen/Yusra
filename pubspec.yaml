name: yusra_pharmacy
description: "Yusra Pharmacy - Care made easy. Pharmacy control system (stock, purchasing, POS, prescriptions, shifts, finance and staff)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^17.5.0
  supabase_flutter: ^2.18.3
  intl: ^0.20.3
  fl_chart: ^1.3.1
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.10
  pdf: ^3.13.1
  printing: ^5.15.1
  mobile_scanner: ^7.5.0
  image_picker: ^1.2.4
  file_picker: ^8.0.7
  csv: ^8.0.0
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  url_launcher: ^6.3.0
  share_plus: ^12.0.2
  permission_handler: ^13.0.2
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Test-only: HS256 JWT signing for the PostgREST-backed e2e-api suite.
  crypto: ^3.0.3

# app_links 6.4.1 uses `flutter.compileSdkVersion` from a plugin buildscript and
# pulls AGP 8.6.1, which cannot be evaluated by the Gradle 8.3 toolchain that
# ships with the pinned Flutter 3.24.5 SDK. 6.2.0 satisfies supabase_flutter's
# `>=6.2.0 <8.0.0` constraint and builds with the app's AGP 8.1.0.
dependency_overrides:
  app_links: 6.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
