# Supabase CLI configuration for Yusra Pharmacy.
# The live project was created manually in the SQL Editor; this file only
# describes the local/CLI setup so `supabase db push` can apply migrations
# to a fresh project in filename order.

project_id = "yusra-pharmacy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://yusra-pharmacy.web.app"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_signins = false
enable_confirmations = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
